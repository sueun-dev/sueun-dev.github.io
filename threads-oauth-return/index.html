<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Returning to Threads Engagement Desk</title>
  <body>
    <main>
      <h1>Returning to Threads Engagement Desk…</h1>
      <p>This page relays the one-time OAuth response to the local app. It does not store a token.</p>
    </main>
    <script>
      (() => {
        const allowed = ["code", "state", "error", "error_description", "error_reason"];
        const destination = new URL("http://localhost:7437/oauth/threads/callback");
        const source = new URLSearchParams(window.location.search);
        for (const key of allowed) {
          const value = source.get(key);
          if (value) destination.searchParams.set(key, value);
        }
        if (!source.has("code") && !source.has("error")) {
          document.querySelector("main").innerHTML = "<h1>Missing OAuth response</h1><p>Return to the local app and start the connection again.</p>";
          return;
        }
        window.location.replace(destination.toString());
      })();
    </script>
  </body>
</html>
